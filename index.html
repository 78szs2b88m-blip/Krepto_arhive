<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Мой киноархив</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #10131a;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 22px 16px 12px;
    }

    h1 {
      font-size: 25px;
      margin: 0 0 8px;
    }

    p {
      color: #b8bdca;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #414653;
      border-radius: 12px;
      background: #202531;
      color: white;
      font-size: 16px;
    }

    main {
      padding: 12px 16px;
    }

    #gallery {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .actor {
      background: #202531;
      border-radius: 14px;
      overflow: hidden;
      cursor: pointer;
    }

    .actor img {
      display: block;
      width: 100%;
      height: 190px;
      object-fit: cover;
      background: #343947;
    }

    .actor div {
      padding: 12px;
      font-weight: bold;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 12px;
      background: #303747;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    .movie {
      display: block;
      margin: 10px 0;
      padding: 14px;
      background: #202531;
      color: #8fc5ff;
      border-radius: 10px;
      text-decoration: none;
    }

    #detail {
      display: none;
    }

    #portrait {
      width: 100%;
      max-height: 360px;
      object-fit: cover;
      border-radius: 14px;
    }

    .back {
      margin: 8px 0 18px;
    }

    #empty {
      display: none;
      color: #b8bdca;
    }

    @media (min-width: 700px) {
      #gallery {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }

      .actor img {
        height: 250px;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>🎬 Мой киноархив</h1>
    <p id="subtitle">Выбери актёра, чтобы увидеть его фильмы</p>
    <input
      id="search"
      type="search"
      placeholder="🔎 Найти актёра..."
      autocomplete="off"
    >
  </header>

  <main>
    <section id="gallery">
      <article class="actor" data-actor="0">
        <img
          src="https://commons.wikimedia.org/wiki/Special:FilePath/Leonardo_DiCaprio_2014.jpg"
          alt="Леонардо ДиКаприо"
        >
        <div>Леонардо ДиКаприо</div>
      </article>

      <article class="actor" data-actor="1">
        <img
          src="https://commons.wikimedia.org/wiki/Special:FilePath/Brad_Pitt_2019_by_Gage_Skidmore.jpg"
          alt="Брэд Питт"
        >
        <div>Брэд Питт</div>
      </article>

      <article class="actor" data-actor="2">
        <img
          src="https://commons.wikimedia.org/wiki/Special:FilePath/Tom_Hanks_by_Gage_Skidmore.jpg"
          alt="Том Хэнкс"
        >
        <div>Том Хэнкс</div>
      </article>

      <article class="actor" data-actor="3">
        <img
          src="https://commons.wikimedia.org/wiki/Special:FilePath/Keanu_Reeves_%28Berlin_Film_Festival_2023%29_%28cropped%29.jpg"
          alt="Киану Ривз"
        >
        <div>Киану Ривз</div>
      </article>
    </section>

    <p id="empty">Актёры не найдены.</p>

    <section id="detail">
      <button class="back" id="back">← Все актёры</button>
      <img id="portrait" alt="Фото актёра">
      <h2 id="name"></h2>
      <div id="films"></div>
    </section>
  </main>

  <!-- Подключение библиотеки Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    // Настройки твоего проекта Supabase
    const SUPABASE_URL = "https://ukiroulynwearnncqcfz.supabase.co";
    const SUPABASE_KEY = "sb_publishable_hTIeWXPg1Gz43XLY3QM3Ug_VFO8ywgo";

    // Создание клиента Supabase
    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    // Демонстрационный каталог актёров
    const actors = [
      {
        name: "Леонардо ДиКаприо",
        photo: "https://commons.wikimedia.org/wiki/Special:FilePath/Leonardo_DiCaprio_2014.jpg",
        movies: [
          ["Начало", "https://www.imdb.com/title/tt1375666/"],
          ["Титаник", "https://www.imdb.com/title/tt0120338/"],
          ["Выживший", "https://www.imdb.com/title/tt1663202/"]
        ]
      },
      {
        name: "Брэд Питт",
        photo: "https://commons.wikimedia.org/wiki/Special:FilePath/Brad_Pitt_2019_by_Gage_Skidmore.jpg",
        movies: [
          ["Бойцовский клуб", "https://www.imdb.com/title/tt0137523/"],
          ["Однажды в Голливуде", "https://www.imdb.com/title/tt7131622/"]
        ]
      },
      {
        name: "Том Хэнкс",
        photo: "https://commons.wikimedia.org/wiki/Special:FilePath/Tom_Hanks_by_Gage_Skidmore.jpg",
        movies: [
          ["Форрест Гамп", "https://www.imdb.com/title/tt0109830/"],
          ["Изгой", "https://www.imdb.com/title/tt0162222/"]
        ]
      },
      {
        name: "Киану Ривз",
        photo: "https://commons.wikimedia.org/wiki/Special:FilePath/Keanu_Reeves_%28Berlin_Film_Festival_2023%29_%28cropped%29.jpg",
        movies: [
          ["Матрица", "https://www.imdb.com/title/tt0133093/"],
          ["Джон Уик", "https://www.imdb.com/title/tt2911666/"]
        ]
      }
    ];

    const gallery = document.getElementById("gallery");
    const search = document.getElementById("search");
    const detail = document.getElementById("detail");
    const empty = document.getElementById("empty");
    const subtitle = document.getElementById("subtitle");

    // Поиск актёров
    function render() {
      const query = search.value.trim().toLocaleLowerCase("ru");
      let count = 0;

      gallery.querySelectorAll(".actor").forEach(card => {
        const actor = actors[Number(card.dataset.actor)];
        const matches = actor.name
          .toLocaleLowerCase("ru")
          .includes(query);

        card.style.display = matches ? "" : "none";

        if (matches) {
          count++;
        }
      });

      empty.style.display = count ? "none" : "block";
    }

    // Открытие страницы актёра
    function openActor(index) {
      const actor = actors[index];

      if (!actor) return;

      gallery.style.display = "none";
      empty.style.display = "none";
      search.style.display = "none";
      subtitle.style.display = "none";
      detail.style.display = "block";

      document.getElementById("portrait").src = actor.photo;
      document.getElementById("name").textContent = actor.name;

      const films = document.getElementById("films");
      films.replaceChildren();

      actor.movies.forEach(movie => {
        const link = document.createElement("a");

        link.className = "movie";
        link.href = movie[1];
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = "🎬 " + movie[0] + " ↗";

        films.appendChild(link);
      });

      window.scrollTo(0, 0);
    }

    // Возврат к каталогу
    function goBack() {
      detail.style.display = "none";
      gallery.style.display = "grid";
      search.style.display = "block";
      subtitle.style.display = "block";

      render();
      window.scrollTo(0, 0);
    }

    search.addEventListener("input", render);

    gallery.querySelectorAll(".actor").forEach(card => {
      card.addEventListener("click", () => {
        openActor(Number(card.dataset.actor));
      });
    });

    document.getElementById("back").addEventListener("click", goBack);

    // Первоначальное отображение каталога
    render();
  </script>
</body>
</html>
