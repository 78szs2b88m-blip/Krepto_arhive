<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мой киноархив</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#10131a;color:white;font-family:Arial,sans-serif}
header{padding:22px 16px 12px}
h1{font-size:25px;margin:0 0 8px}
p,small{color:#b8bdca}
input{width:100%;padding:13px;border:1px solid #414653;border-radius:12px;background:#202531;color:white;font-size:16px}
main{padding:12px 16px}
#gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.actor{background:#202531;border-radius:14px;overflow:hidden;cursor:pointer}
.actor img{display:block;width:100%;height:190px;object-fit:cover;background:#343947}
.actor div{padding:12px;font-weight:bold}
button{border:0;border-radius:10px;padding:12px;background:#303747;color:white;font-size:15px}
.movie{display:block;margin:10px 0;padding:14px;background:#202531;color:#8fc5ff;border-radius:10px;text-decoration:none}
#detail{display:none}
#portrait{width:100%;max-height:360px;object-fit:cover;border-radius:14px}
.back{margin:8px 0 18px}
</style>
</head>
<body>
<header>
<h1>🎬 Мой киноархив</h1>
<p id="subtitle">Выбери актёра, чтобы увидеть его фильмы</p>
<input id="search" placeholder="🔎 Найти актёра..." autocomplete="off">
</header>
<main>
<section id="gallery"></section>
<p id="empty" hidden>Актёры не найдены.</p>
<section id="detail">
<button class="back" id="back">← Все актёры</button>
<img id="portrait" alt="Фото актёра">
<h2 id="name"></h2>
<div id="films"></div>
</section>
</main>
<script>
const actors = [
{name:"Леонардо ДиКаприо",photo:"https://commons.wikimedia.org/wiki/Special:FilePath/Leonardo_DiCaprio_2014.jpg",movies:[
["Начало","https://www.imdb.com/title/tt1375666/"],
["Титаник","https://www.imdb.com/title/tt0120338/"],
["Выживший","https://www.imdb.com/title/tt1663202/"]]},
{name:"Брэд Питт",photo:"https://commons.wikimedia.org/wiki/Special:FilePath/Brad_Pitt_2019_by_Gage_Skidmore.jpg",movies:[
["Бойцовский клуб","https://www.imdb.com/title/tt0137523/"],
["Однажды в Голливуде","https://www.imdb.com/title/tt7131622/"]]},
{name:"Том Хэнкс",photo:"https://commons.wikimedia.org/wiki/Special:FilePath/Tom_Hanks_by_Gage_Skidmore.jpg",movies:[
["Форрест Гамп","https://www.imdb.com/title/tt0109830/"],
["Изгой","https://www.imdb.com/title/tt0162222/"]]},
{name:"Киану Ривз",photo:"https://commons.wikimedia.org/wiki/Special:FilePath/Keanu_Reeves_%28Berlin_Film_Festival_2023%29_%28cropped%29.jpg",movies:[
["Матрица","https://www.imdb.com/title/tt0133093/"],
["Джон Уик","https://www.imdb.com/title/tt2911666/"]]}
];

const gallery=document.getElementById("gallery");
const search=document.getElementById("search");
const detail=document.getElementById("detail");

function render(){
  const q=search.value.trim().toLocaleLowerCase("ru");
  const matches=actors.filter(a=>a.name.toLocaleLowerCase("ru").includes(q));
  gallery.innerHTML="";
  document.getElementById("empty").hidden=matches.length>0;

  matches.forEach(a=>{
    const card=document.createElement("article");
    card.className="actor";
    const img=document.createElement("img");
    img.src=a.photo;
    img.alt=a.name;
    img.onerror=()=>{img.style.display="none"};
    const title=document.createElement("div");
    title.textContent=a.name;
    card.append(img,title);
    card.addEventListener("click",()=>openActor(a));
    gallery.appendChild(card);
  });
}

function openActor(a){
  gallery.style.display="none";
  search.style.display="none";
  document.getElementById("empty").hidden=true;
  document.getElementById("subtitle").style.display="none";
  detail.style.display="block";
  document.getElementById("portrait").src=a.photo;
  document.getElementById("portrait").style.display="block";
  document.getElementById("name").textContent=a.name;
  const films=document.getElementById("films");
  films.innerHTML="";
  a.movies.forEach(m=>{
    const link=document.createElement("a");
    link.className="movie";
    link.href=m[1];
    link.target="_blank";
    link.rel="noopener";
    link.textContent="🎬 "+m[0]+" ↗";
    films.appendChild(link);
  });
}

function goBack(){
  detail.style.display="none";
  gallery.style.display="grid";
  search.style.display="block";
  document.getElementById("subtitle").style.display="block";
  render();
}

search.addEventListener("input",render);
document.getElementById("back").addEventListener("click",goBack);
render();

  );
</script>
</body>
</html>
